<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=JetBrains+Mono:wght@500&family=Newsreader:wght@500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;background:#0A0B0D;color:#F6F7F8;font-family:Inter,sans-serif;overflow:hidden}
.f{position:absolute;inset:0;padding:64px 72px;display:grid;grid-template-columns:1.25fr .75fr;gap:48px}
.brand{display:flex;align-items:center;gap:12px;font:600 26px Inter}
.dot{width:14px;height:14px;border-radius:50%;background:#F4A521;box-shadow:0 0 16px #F4A521}

h1 b{font-weight:500;color:#F4A521}
.foot{position:absolute;left:72px;bottom:56px;font:500 17px "JetBrains Mono";letter-spacing:.12em;text-transform:uppercase;color:#8A8F98}
.sp{position:relative;margin-top:22px;padding-left:34px}
.sp:before{content:"";position:absolute;left:7px;top:10px;height:242px;width:2px;background:#24272C}
.t{position:relative;padding-bottom:30px;font:500 17px "JetBrains Mono";letter-spacing:.1em;text-transform:uppercase;color:#7B8089}
.t:before{content:"";position:absolute;left:-32px;top:3px;width:12px;height:12px;border-radius:50%;background:#F6F7F8}
.t.f2{color:#F6F7F8}
.t.now{color:#F4A521}.t.now:before{background:#F4A521;box-shadow:0 0 0 6px rgba(244,165,33,.15),0 0 18px #F4A521}

</style></head><body><div class="f">
<div><div class="brand"><span class="dot"></span>Followthrough</div>

<div class="t f2">Said<span>“Can approvers see the receipt?”</span></div>
<div class="t f2">Routed<span>Product track, owner set</span></div>
<div class="t f2">Shipped<span>Matched to v2.4.0</span></div>

</div></div>
<div class="foot">Open source · Close the loop on every client promise</div>
</body></html>
